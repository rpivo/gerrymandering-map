[project]
name = "gerry"
version = "0.1.0"
description = "Data pipeline for gerrymandering-map: district boundaries, compactness scores, JSON export."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gerry"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tools/tests"]
addopts = "--strict-markers"

# Ruff is configured repo-wide in ../ruff.toml.
